name: Test Setup

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Virtual Environment & Install Dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install --upgrade undetected-chromedriver selenium requests

      - name: Check secrets are configured
        env:
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ -z "$USER_NAME" ]; then
            echo "USER_NAME secret is not set!"
            exit 1
          else
            echo "USER_NAME is configured"
          fi

          if [ -z "$PASSWORD" ]; then
            echo "PASSWORD secret is not set!"
            exit 1
          else
            echo "PASSWORD is configured"
          fi

          if [ -z "$BOT_TOKEN" ]; then
            echo "BOT_TOKEN secret is not set!"
            exit 1
          else
            echo "BOT_TOKEN is configured"
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "CHAT_ID secret is not set!"
            exit 1
          else
            echo "CHAT_ID is configured"
          fi

          echo ""
          echo "All secrets are configured!"

      - name: Check required files exist
        run: |
          echo "Checking for required files..."

          if [ -f "main.py" ]; then
            echo "main.py found"
          else
            echo "main.py not found!"
            exit 1
          fi

          if [ -f "requirements.txt" ]; then
            echo "requirements.txt found"
          else
            echo "requirements.txt not found!"
            exit 1
          fi

          echo ""
          echo "All required files found!"

      - name: Test Python syntax
        run: |
          source venv/bin/activate
          python -m py_compile main.py && echo "Python syntax OK"

      - name: Success
        run: |
          echo ""
          echo "========================================"
          echo "  All checks passed!"
          echo "  Your setup is ready to go."
          echo "========================================"
